<svg xmlns="http://www.w3.org/2000/svg" width="330" height="64" viewBox="0 0 330 64" role="img" aria-label="Support NXBeam on Saweria">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="btn"><rect x="12" y="10" width="306" height="44" rx="22"/></clipPath>
    <style>
      .ring{transform-origin:165px 32px;animation:ring 1.8s ease-out infinite}
      .heart{transform-origin:44px 32px;animation:beat 1.8s ease-in-out infinite}
      .sweep{animation:sweep 2.6s ease-in-out infinite}
      @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.12,1.45)}}
      @keyframes beat{0%,40%,100%{transform:scale(1)}15%{transform:scale(1.25)}28%{transform:scale(1.1)}}
      @keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(380px)}}
    </style>
  </defs>
  <rect class="ring" x="12" y="10" width="306" height="44" rx="22" fill="none" stroke="#FAAE2B" stroke-width="3"/>
  <rect x="12" y="10" width="306" height="44" rx="22" fill="#FAAE2B"/>
  <g clip-path="url(#btn)"><rect class="sweep" x="0" y="10" width="80" height="44" fill="url(#shine)"/></g>
  <path class="heart" d="M44 41.5s-9-5.6-9-11.6a4.9 4.9 0 0 1 9-2.7 4.9 4.9 0 0 1 9 2.7c0 6-9 11.6-9 11.6z" fill="#B3261E"/>
  <text x="62" y="38.5" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2A1D05">Support NXBeam on Saweria</text>
</svg>
