<svg xmlns="http://www.w3.org/2000/svg" width="196" height="28" viewBox="0 0 196 28" role="img" aria-label="Support on Saweria">
  <defs>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="196" height="28" rx="4"/></clipPath>
    <style>
      .glint{animation:g 4s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes g{0%,55%{transform:translateX(-60px)}85%,100%{transform:translateX(240px)}}
      @media (prefers-reduced-motion:reduce){.glint{animation:none;opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="106" height="28" fill="#151B24"/>
    <rect x="106" width="90" height="28" fill="#FAAE2B"/>
    <path class="glint" d="M22 0h20L26 28H6z" fill="url(#glint)"/>
  </g>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="10" letter-spacing="1.25" text-anchor="middle">
    <text x="53" y="17.5" fill="#FFFFFF">SUPPORT ON</text>
    <text x="151" y="17.5" fill="#333333" font-weight="bold">SAWERIA</text>
  </g>
</svg>
