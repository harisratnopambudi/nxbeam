<svg xmlns="http://www.w3.org/2000/svg" width="840" height="236" viewBox="0 0 840 236" role="img" aria-label="Tested on Nintendo Switch firmware 23.5.0 and Atmosphère 1.12.2|E (emuMMC)">
  <style>
    .f { font-family: "Segoe UI", "Bahnschrift", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #8f9cae; letter-spacing: 0.04em; }
    .label { font-size: 15px; font-weight: 600; fill: #8f9cae; }
    .big { font-size: 58px; font-weight: 700; fill: #e4eaf2; }
    .sub { font-size: 15px; fill: #8f9cae; }
    .pill { font-size: 13px; font-weight: 600; fill: #151b24; }
  </style>
  <defs>
    <clipPath id="pl"><rect x="28" y="58" width="378" height="152" rx="14"/></clipPath>
    <clipPath id="pr"><rect x="434" y="58" width="378" height="152" rx="14"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="235" rx="18" fill="#151b24" stroke="#2d3948"/>
  <!-- header -->
  <g class="f">
    <circle cx="353" cy="31" r="9" fill="#58c68e"/>
    <path d="M348.5 31l3 3 5.5-6" fill="none" stroke="#151b24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="370" y="36.5" class="title">Tested and working on</text>
  </g>
  <!-- left panel: firmware -->
  <g class="f">
    <rect x="28" y="58" width="378" height="152" rx="14" fill="#1d2530" stroke="#2d3948"/>
    <rect x="28" y="58" width="378" height="5" fill="#e60012" clip-path="url(#pl)"/>
    <rect x="173" y="82" width="88" height="24" rx="12" fill="#e60012"/>
    <text x="217" y="98.5" text-anchor="middle" class="pill" fill="#ffffff" style="fill:#ffffff">Switch</text>
    <text x="217" y="162" text-anchor="middle" class="big">23.5.0</text>
    <text x="217" y="192" text-anchor="middle" class="sub">Firmware</text>
  </g>
  <!-- right panel: Atmosphère -->
  <g class="f">
    <rect x="434" y="58" width="378" height="152" rx="14" fill="#1d2530" stroke="#2d3948"/>
    <rect x="434" y="58" width="378" height="5" fill="#8b6ff0" clip-path="url(#pr)"/>
    <rect x="573" y="82" width="100" height="24" rx="12" fill="#8b6ff0"/>
    <text x="623" y="98.5" text-anchor="middle" class="pill" style="fill:#ffffff">emuMMC</text>
    <text x="623" y="162" text-anchor="middle" class="big">1.12.2|E</text>
    <text x="623" y="192" text-anchor="middle" class="sub">Atmosphère</text>
  </g>
