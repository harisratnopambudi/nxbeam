name: Android check

# builds the Android app on every branch except main (main builds it inside Release)
on:
  push:
    branches-ignore: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'package.json']
  workflow_dispatch:

jobs:
  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: gradle -p android --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NXBeam-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NXBeam-Android.apk
