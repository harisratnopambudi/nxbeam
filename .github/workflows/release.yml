name: Release

# every push to main publishes the version in package.json (v<version>);
# pushing again with the same version updates that release
on:
  push:
    branches: [main]
    tags: ['v*']
    # a README or guide edit is not a new version (online updates follow every release)
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc-windows:
    name: PC (Windows app, installer and portable)
    # libwdi (the USB driver tool) builds with the Visual Studio 2022 toolset
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: windows/wdi/wdi-simple.exe
          key: wdi-simple-${{ hashFiles('windows/build-wdi.ps1') }}
      - name: Build the USB driver tool (libwdi)
        shell: pwsh
        run: |
          if (-not (Test-Path windows/wdi/wdi-simple.exe)) { ./windows/build-wdi.ps1 }
          if (-not (Test-Path windows/wdi/libwdi)) { git clone -q --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi windows/wdi/libwdi }
      - name: Install dependencies (ffmpeg and USB included)
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Self-test
        run: node tools/selftest.js
      - name: Build NXBeam.exe, the portable zip and the installer
        shell: pwsh
        run: ./windows/build.ps1 -Build $env:GITHUB_RUN_NUMBER
      - name: The window starts, loads the viewer and closes cleanly
        shell: pwsh
        run: |
          $p = Start-Process dist/NXBeam/NXBeam.exe -ArgumentList "--selftest `"$PWD\selftest`"" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); throw "NXBeam.exe self-test timed out" }
          Get-Content selftest/result.txt | Select-Object -First 3
          if ($p.ExitCode -ne 0) { throw "NXBeam.exe self-test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: pc-windows
          path: |
            dist/NXBeam-PC-Windows.zip
            dist/NXBeam-Setup.exe

  pc-macos:
    name: PC viewer (macOS, portable)
    timeout-minutes: 12
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Self-test
        run: node tools/selftest.js
      - name: Build Apple Silicon and Intel folders
        run: |
          set -e
          NODEV=$(node -v)
          for arch in arm64 x64; do
            label=$([ $arch = arm64 ] && echo AppleSilicon || echo Intel)
            dst="dist/$arch/NXBeam"
            mkdir -p "$dst/runtime"
            cp -R src public tools node_modules package.json LICENSE "Start NXBeam.command" "$dst/"
            cp package.json "$dst/node_modules/.nxbeam-package.json"
            node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({version: require('./package.json').version, build: Number(process.env.GITHUB_RUN_NUMBER)}))" "$dst/build.json"
            # ffmpeg for this CPU
            rm -f "$dst/node_modules/ffmpeg-static/ffmpeg"
            (cd "$dst/node_modules/ffmpeg-static" && npm_config_arch=$arch npm_config_platform=darwin node install.js)
            file "$dst/node_modules/ffmpeg-static/ffmpeg"
            # the official, signed Node.js for this CPU
            curl -fsSL "https://nodejs.org/dist/$NODEV/node-$NODEV-darwin-$arch.tar.gz" | tar -xz -C dist/$arch
            cp "dist/$arch/node-$NODEV-darwin-$arch/bin/node" "$dst/runtime/node"
            file "$dst/runtime/node"
            chmod +x "$dst/runtime/node" "$dst/node_modules/ffmpeg-static/ffmpeg" "$dst/Start NXBeam.command"
            (cd dist/$arch && ditto -c -k --keepParent NXBeam "../NXBeam-PC-macOS-$label.zip")
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: pc-macos
          path: dist/NXBeam-PC-macOS-*.zip

  overlay:
    name: Switch overlay
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nxbeam.ovl
        working-directory: overlay
        run: |
          # the update check uses libcurl (HTTPS through mbedTLS); pkg.devkitpro.org sometimes answers 403: try again
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Sy --noconfirm --needed switch-curl switch-zlib switch-mbedtls && break
            [ "$i" = 6 ] && exit 1
            sleep $((i * 20))
          done
          git clone --depth 1 https://github.com/WerWolv/libtesla libs/libtesla
          # the overlay shows the NXBeam version, not a number of its own
          make -j"$(nproc)" APP_VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' ../package.json | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: overlay
          path: overlay/nxbeam.ovl

  switch-updater:
    name: Switch updater (NXBeam Update)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NXBeam-Update.nro
        working-directory: switch-updater
        run: |
          # pkg.devkitpro.org sometimes answers 403 for a while: try again
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Sy --noconfirm --needed switch-curl switch-zlib switch-mbedtls && break
            [ "$i" = 6 ] && exit 1
            echo "devkitPro packages not reachable, again in $((i * 20)) s"; sleep $((i * 20))
          done
          # the CA list mbedTLS checks GitHub's certificates against
          (curl -fsSL https://curl.se/ca/cacert.pem -o romfs/cacert.pem || wget -qO romfs/cacert.pem https://curl.se/ca/cacert.pem)
          test -s romfs/cacert.pem
          make -j"$(nproc)" APP_VERSION="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' ../package.json | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-updater
          path: switch-updater/NXBeam-Update.nro

  switch-pack:
    name: Switch SD pack
    needs: [overlay, switch-updater]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overlay
          path: switch-pack/switch/.overlays
      - uses: actions/download-artifact@v4
        with:
          name: switch-updater
          path: switch-pack/switch/NXBeam-Update
      - name: Zip for the SD card
        run: |
          find switch-pack -name .keep -delete
          # version and build of this pack: NXBeam Update and the overlay read it
          printf '%s\n%s\n' "$(node -p "require('./package.json').version")" "$GITHUB_RUN_NUMBER" > switch-pack/NXBeam/versi.txt
          cd switch-pack && zip -r ../NXBeam-Switch.zip atmosphere NXBeam switch
      - uses: actions/upload-artifact@v4
        with:
          name: switch-pack
          path: NXBeam-Switch.zip

  android:
    name: Android app (phones and Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: gradle -p android --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NXBeam-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NXBeam-Android.apk

  release:
    name: Publish
    needs: [pc-windows, pc-macos, switch-pack, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # releases listed in .github/drop-releases.txt are deleted with their tags
      # before publishing (folding several small releases into one)
      - name: Drop releases folded into this one
        if: hashFiles('.github/drop-releases.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r t; do
            [ -z "$t" ] && continue
            gh release delete "$t" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" && echo "deleted $t" || echo "no release $t"
            git push origin ":refs/tags/$t" 2>/dev/null || true
          done < .github/drop-releases.txt
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Keep only the release zips
        run: find assets -type f ! -name '*.zip' ! -name '*.apk' ! -name 'NXBeam-Setup.exe' -delete
      - name: Source for Linux / macOS
        run: |
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({version: require('./package.json').version, build: Number(process.env.GITHUB_RUN_NUMBER)}))" build.json
          zip -r assets/NXBeam-PC-source.zip src public tools package.json package-lock.json LICENSE start.sh "Start NXBeam.bat" "Start NXBeam.command" README.md build.json
      - name: latest.json (what online updates check)
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const files = {};
            for (const f of fs.readdirSync("assets")) {
              const b = fs.readFileSync("assets/" + f);
              files[f] = { sha256: crypto.createHash("sha256").update(b).digest("hex"), size: b.length };
            }
            const out = { version: require("./package.json").version, build: Number(process.env.GITHUB_RUN_NUMBER), files };
            fs.writeFileSync("assets/latest.json", JSON.stringify(out, null, 1));
            console.log(JSON.stringify(out, null, 1));
          '
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NXBeam ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            assets/*.zip
            assets/*.apk
            assets/NXBeam-Setup.exe
            assets/latest.json
          body: |
            ## Unduhan
            | File | Untuk |
            |---|---|
            | **NXBeam-Setup.exe** | **PC Windows 10/11 (disarankan).** Installer: aplikasi NXBeam dengan jendela sendiri, ikon di tray, update otomatis, dan driver USB untuk Switch langsung terpasang (tanpa Zadig, Switch tidak perlu dicolok dulu). |
            | NXBeam-PC-Windows.zip | Versi portable Windows: ekstrak, lalu klik `NXBeam.exe` (atau `Start NXBeam.bat`). |
            | **NXBeam-PC-macOS-AppleSilicon.zip** | Mac M1/M2/M3/M4. Portable: ekstrak, lalu klik kanan `Start NXBeam.command` > Open. |
            | **NXBeam-PC-macOS-Intel.zip** | Mac Intel. Sama seperti di atas. |
            | **NXBeam-Android.apk** | HP, tablet, dan Android TV / Google TV (Android 8 ke atas). Tersambung langsung ke Switch lewat Wi-Fi atau USB OTG tanpa PC, atau menonton NXBeam yang jalan di PC. |
            | **NXBeam-Switch.zip** | Ekstrak ke root SD card Switch (folder `atmosphere`, `NXBeam`, `switch`). |
            | NXBeam-PC-source.zip | Linux (butuh Node.js 18+): jalankan `./start.sh`. |
