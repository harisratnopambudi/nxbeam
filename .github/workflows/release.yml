name: Release

# every push to main publishes the version in package.json (v<version>);
# pushing again with the same version updates that release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc-windows:
    name: PC viewer (Windows, portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (ffmpeg and USB included)
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Self-test
        run: node tools/selftest.js
      - name: Assemble the portable folder
        shell: pwsh
        run: |
          $dst = "dist/NXBeam"
          New-Item -ItemType Directory -Force -Path "$dst/runtime" | Out-Null
          Copy-Item -Recurse src, public, tools, node_modules, package.json, LICENSE, "Start NXBeam.bat" $dst
          Copy-Item (Get-Command node).Source "$dst/runtime/node.exe"
          Copy-Item package.json "$dst/node_modules/.nxbeam-package.json"
          if (-not (Test-Path "$dst/node_modules/ffmpeg-static/ffmpeg.exe")) { throw "ffmpeg.exe missing" }
          Compress-Archive -Path $dst -DestinationPath dist/NXBeam-PC-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc-windows
          path: dist/NXBeam-PC-Windows.zip

  pc-macos:
    name: PC viewer (macOS, portable)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev --no-fund --no-audit
      - name: Self-test
        run: node tools/selftest.js
      - name: Build Apple Silicon and Intel folders
        run: |
          set -e
          NODEV=$(node -v)
          for arch in arm64 x64; do
            label=$([ $arch = arm64 ] && echo AppleSilicon || echo Intel)
            dst="dist/$arch/NXBeam"
            mkdir -p "$dst/runtime"
            cp -R src public tools node_modules package.json LICENSE "Start NXBeam.command" "$dst/"
            cp package.json "$dst/node_modules/.nxbeam-package.json"
            # ffmpeg for this CPU
            rm -f "$dst/node_modules/ffmpeg-static/ffmpeg"
            (cd "$dst/node_modules/ffmpeg-static" && npm_config_arch=$arch npm_config_platform=darwin node install.js)
            file "$dst/node_modules/ffmpeg-static/ffmpeg"
            # the official, signed Node.js for this CPU
            curl -fsSL "https://nodejs.org/dist/$NODEV/node-$NODEV-darwin-$arch.tar.gz" | tar -xz -C dist/$arch
            cp "dist/$arch/node-$NODEV-darwin-$arch/bin/node" "$dst/runtime/node"
            file "$dst/runtime/node"
            chmod +x "$dst/runtime/node" "$dst/node_modules/ffmpeg-static/ffmpeg" "$dst/Start NXBeam.command"
            (cd dist/$arch && ditto -c -k --keepParent NXBeam "../NXBeam-PC-macOS-$label.zip")
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: pc-macos
          path: dist/NXBeam-PC-macOS-*.zip

  overlay:
    name: Switch overlay
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build nxbeam.ovl
        working-directory: overlay
        run: |
          git clone --depth 1 https://github.com/WerWolv/libtesla libs/libtesla
          make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: overlay
          path: overlay/nxbeam.ovl

  switch-pack:
    name: Switch SD pack
    needs: overlay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: overlay
          path: switch-pack/switch/.overlays
      - name: Zip for the SD card
        run: |
          find switch-pack -name .keep -delete
          cd switch-pack && zip -r ../NXBeam-Switch.zip atmosphere NXBeam switch
      - uses: actions/upload-artifact@v4
        with:
          name: switch-pack
          path: NXBeam-Switch.zip

  android:
    name: Android app (phones and Android TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: gradle -p android --no-daemon assembleRelease
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NXBeam-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NXBeam-Android.apk

  release:
    name: Publish
    needs: [pc-windows, pc-macos, switch-pack, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Keep only the release zips
        run: find assets -type f ! -name '*.zip' ! -name '*.apk' -delete
      - name: Source for Linux / macOS
        run: zip -r assets/NXBeam-PC-source.zip src public tools package.json package-lock.json LICENSE start.sh "Start NXBeam.bat" "Start NXBeam.command" README.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NXBeam ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            assets/*.zip
            assets/*.apk
          body: |
            ## Unduhan
            | File | Untuk |
            |---|---|
            | **NXBeam-PC-Windows.zip** | Viewer di PC Windows. Portable: ekstrak, lalu klik `Start NXBeam.bat`. Tidak perlu memasang Node.js. |
            | **NXBeam-PC-macOS-AppleSilicon.zip** | Mac M1/M2/M3/M4. Portable: ekstrak, lalu klik kanan `Start NXBeam.command` > Open. |
            | **NXBeam-PC-macOS-Intel.zip** | Mac Intel. Sama seperti di atas. |
            | **NXBeam-Android.apk** | HP, tablet, dan Android TV / Google TV (Android 8 ke atas). Tersambung langsung ke Switch lewat Wi-Fi atau USB OTG tanpa PC, atau menonton NXBeam yang jalan di PC. |
            | **NXBeam-Switch.zip** | Ekstrak ke root SD card Switch (folder `atmosphere`, `NXBeam`, `switch`). |
            | NXBeam-PC-source.zip | Linux (butuh Node.js 18+): jalankan `./start.sh`. |
