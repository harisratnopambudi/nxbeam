# NXBeam - setting streaming di Switch
# Letak di SD card: /NXBeam/console-settings/config.ini
# Mode koneksi dibaca saat boot: setelah mengganti file ini, restart Switch.
# connection: usb | network
connection = network
# quality: high | medium | low
quality = medium
# max_resolution: 1080 | 720   (720 = paling stabil 60 fps)
max_resolution = 1080
# memory_boost: 1 = menyalin frame 1080p lebih cepat
memory_boost = 1
# audio: 1 = suara game ikut di-stream
audio = 1
# viewer_input: 1 = NXBeam bisa memainkan Switch (kontroler tambahan)
viewer_input = 1
# screen_off: 1 = layar Switch mati selama streaming
screen_off = 0
# home_menu: 1 = HOME menu dan layar sistem ikut tampil (beta, bisa membuat tombol HOME lambat)
home_menu = 0
# overlays: 1 = bar volume, quick settings, menu power, Tesla/Ultrahand ikut tampil (beta)
overlays = 0
# versi format pengaturan (dipakai overlay dan NXBeam Update)
config_version = 2
